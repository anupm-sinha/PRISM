<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 216" width="820" height="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <linearGradient id="ctxgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9650ff"/>
      <stop offset="1" stop-color="#dd64ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="10" y="10" width="800" height="196" rx="16" fill="#07090f" stroke="#1b1f33" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="10.75" y="10.75" width="798.5" height="40" rx="15" fill="#ffffff" opacity="0.015"/>

  <!-- window dots + wordmark -->
  <circle cx="38" cy="36" r="5.5" fill="#ff5f56"/>
  <circle cx="58" cy="36" r="5.5" fill="#ffbd2e"/>
  <circle cx="78" cy="36" r="5.5" fill="#27c93f"/>
  <text x="784" y="40" text-anchor="end" font-size="12" fill="#3a3566">PRISM &#183; neon</text>

  <!-- title: model + effort -->
  <text x="36" y="88" font-size="18" fill="#4ff0ff" filter="url(#glow)">&#10035;</text>
  <text x="60" y="88" font-size="18" font-weight="700" fill="#ff5fd2" filter="url(#glow)">Opus 4.8</text>
  <text x="784" y="88" text-anchor="end" font-size="16" fill="#ffe066" filter="url(#glow)">&#9889; high</text>

  <!-- meters -->
  <text x="36" y="131" font-size="15" fill="#5a637e">ctx</text>
  <rect x="74" y="119" width="190" height="15" rx="7.5" fill="#23283b"/>
  <rect x="74" y="119" width="72" height="15" rx="7.5" fill="url(#ctxgrad)" filter="url(#glow)"/>
  <text x="276" y="131" font-size="15" fill="#4ff0ff">38%</text>

  <text x="340" y="131" font-size="15" fill="#5a637e">5h</text>
  <rect x="368" y="119" width="80" height="15" rx="7.5" fill="#23283b"/>
  <rect x="368" y="119" width="42" height="15" rx="7.5" fill="#54f8a0"/>
  <text x="458" y="131" font-size="15" fill="#54f8a0">52%</text>

  <text x="522" y="131" font-size="15" fill="#5a637e">7d</text>
  <rect x="550" y="119" width="80" height="15" rx="7.5" fill="#23283b"/>
  <rect x="550" y="119" width="59" height="15" rx="7.5" fill="#ffb454"/>
  <text x="640" y="131" font-size="15" fill="#ffb454">74%</text>

  <!-- session line -->
  <text x="36" y="174" font-size="15" fill="#aab4cf">&#9719; 18m</text>
  <text x="152" y="174" font-size="15" fill="#54f8a0">$1.27</text>
  <text x="248" y="174" font-size="15" fill="#b794ff">&#9095; main</text>
  <text x="360" y="174" font-size="15" fill="#54f8a0">+156</text>
  <text x="416" y="174" font-size="15" fill="#5a637e">&#8722;23</text>
</svg>
